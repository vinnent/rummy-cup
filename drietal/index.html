<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drietal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0d">
<title>Drietal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Rubik:wght@700;800&display=swap">
<style>
/* Layout: the iPad lies flat between two players. Each player has a band at their own edge
   (the top one turned upside down), the cards lie in the middle, the stack and +3 sit at the side. */
:root{
  --felt:#0c0c0d; --felt-2:#18181a; --felt-3:#2c2c30; --edge:#000;
  --ink:#f2f2f0; --muted:#a3a3a6; --card:#ffffff; --card-edge:#cfcfd2;
  --c0:#1d5fd6; --c1:#dc2a1f; --c2:#f5b700;               /* primary colours: blauw, rood, geel */
  --c0-line:#1d5fd6; --c1-line:#dc2a1f; --c2-line:#d49800; /* lines and stripes; yellow a touch deeper to stay readable */
  --p0:#f0b12b; --p1:#5fd3c3; --p-ink:#13201b;
  --bad:#ff6d61; --shadow:rgba(0,0,0,.45);
  --f-display:"Rubik","Arial Black",system-ui,sans-serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--felt);color:var(--ink);overflow:hidden}
body{font:500 15px/1.4 var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:var(--felt) radial-gradient(120% 90% at 50% 50%, var(--felt-2) 0 40%, var(--felt) 75%, var(--edge) 100%)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--p0);outline-offset:2px}
[hidden]{display:none!important}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* Player bands */
.zone{--pc:var(--p0);display:flex;align-items:center;gap:clamp(10px, 1.6vw, 22px);
  padding:4px max(16px, 2.2vw);background:#141416}
.zone[data-p="1"]{--pc:var(--p1);transform:rotate(180deg)}
.z-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.z-name{font:800 clamp(20px, 2.6vw, 28px)/1.1 var(--f-display);color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.z-msg{font:600 clamp(14px, 1.7vw, 17px)/1.3 var(--f-ui);color:var(--ink);min-height:1.3em}
.z-msg.dim{color:var(--muted);font-weight:500}
.z-score{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:64px}
.z-score b{font:800 clamp(30px, 4.4vw, 46px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.z-score span{font:700 11px var(--f-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.z-score.bump b{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
/* The Set button: a big oval push button in a dark housing. It sinks when pressed and stays down, lit, while you choose.
   The timer next to it has exactly the same size. */
.buzz,.timer{--h:clamp(74px, min(19vmin, 13.5vw), 158px);--w:calc(var(--h) * 1.65)}
.buzz{--deep:color-mix(in srgb, var(--pc) 52%, #000);--light:color-mix(in srgb, var(--pc) 50%, #fff);
  position:relative;flex:none;width:var(--w);height:var(--h);margin:calc(var(--h) * .1);padding:0;border:0;border-radius:50%;background:transparent}
.buzz::before{content:"";position:absolute;inset:calc(var(--h) * -.075);border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%, #3b3b40 0 45%, #111113 72%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.14),inset 0 -3px 6px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.55)}
.buzz .cap{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(ellipse at 36% 28%, var(--light) 0 7%, var(--pc) 46%, var(--deep) 100%);
  box-shadow:0 calc(var(--h) * .08) 0 var(--deep),0 calc(var(--h) * .08 + 5px) 12px rgba(0,0,0,.5),inset 0 -5px 10px rgba(0,0,0,.18),inset 0 3px 3px rgba(255,255,255,.35);
  transform:translateY(calc(var(--h) * -.065));transition:transform .07s ease-out, box-shadow .07s ease-out;
  font:800 calc(var(--h) * .38)/1 var(--f-display);letter-spacing:.02em;color:var(--p-ink);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.buzz:active .cap,.buzz.down .cap{transform:translateY(calc(var(--h) * .01));
  box-shadow:0 calc(var(--h) * .012) 0 var(--deep),0 3px 6px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.2),inset 0 3px 3px rgba(255,255,255,.3)}
.buzz.down .cap{font-size:calc(var(--h) * .2);animation:lit 1s ease-in-out infinite alternate}
@keyframes lit{from{filter:brightness(1.05)}to{filter:brightness(1.3) drop-shadow(0 0 calc(var(--h) * .12) var(--pc))}}
.buzz:disabled{cursor:default}
.buzz:disabled .cap{filter:saturate(.2) brightness(.55)}
.timer{--tc:var(--pc);position:relative;flex:none;width:var(--w);height:var(--h);margin:calc(var(--h) * .1);border-radius:50%;
  background:conic-gradient(var(--tc) calc(var(--p, 1) * 360deg), rgba(255,255,255,.09) 0);box-shadow:0 6px 16px rgba(0,0,0,.55)}
.timer::before{content:"";position:absolute;inset:calc(var(--h) * .09);border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%, #2b2b2f, #0e0e10 75%);box-shadow:inset 0 3px 8px rgba(0,0,0,.7)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--h) * .66)/1 var(--f-display);color:var(--tc);font-variant-numeric:tabular-nums}
.timer.hurry{--tc:var(--bad)}
.timer.hurry b{animation:tick .5s ease-in-out infinite alternate}
@keyframes tick{to{transform:scale(1.14)}}
.z-new{height:56px;padding:0 24px;border:0;border-radius:999px;background:transparent;color:var(--pc);box-shadow:inset 0 0 0 3px var(--pc);
  font:800 clamp(17px, 2vw, 21px)/1 var(--f-display);margin:10px}
.zone.claiming{background:color-mix(in srgb, var(--pc) 22%, transparent);box-shadow:inset 0 0 0 3px var(--pc)}

/* Table */
.board{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px max(12px, 1.6vw)}
.grid{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.cards{display:grid;grid-template-columns:repeat(var(--cols,4), var(--cw,100px));gap:var(--gap,12px);justify-content:center;align-content:center}
.card{width:var(--cw,100px);aspect-ratio:2/3;padding:0;border:0;border-radius:calc(var(--cw,100px) * .12);
  background:linear-gradient(180deg,var(--card) 0 88%,var(--card-edge));box-shadow:0 2px 0 var(--card-edge),0 6px 14px var(--shadow);
  display:grid;place-items:center;transition:transform .12s ease, box-shadow .12s ease}
.card svg{width:92%;height:92%;display:block}
.card.sel{transform:scale(1.05);box-shadow:0 0 0 calc(var(--cw,100px) * .045) var(--pc, var(--p0)),0 10px 22px var(--shadow)}
.card.hint{transform:scale(1.06);box-shadow:0 0 0 calc(var(--cw,100px) * .055) #fff,0 0 34px rgba(255,255,255,.75);animation:hint .7s ease-in-out infinite alternate}
@keyframes hint{from{transform:scale(1.06)}to{transform:scale(.98)}}
.card.nope{animation:nope .45s ease-in-out;box-shadow:0 0 0 calc(var(--cw,100px) * .045) var(--bad),0 6px 14px var(--shadow)}
@keyframes nope{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.card.go0{animation:go0 .45s ease-in forwards}
.card.go1{animation:go1 .45s ease-in forwards}
@keyframes go0{to{transform:translateY(60px) scale(.6);opacity:0}}
@keyframes go1{to{transform:translateY(-60px) scale(.6);opacity:0}}
.card.deal{animation:deal .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes deal{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}

/* Symbols */
.sym .s0{fill:var(--c0);stroke:var(--c0-line)} .sym .s1{fill:var(--c1);stroke:var(--c1-line)} .sym .s2{fill:var(--c2);stroke:var(--c2-line)}
.sym .f1.s0{fill:url(#st0)} .sym .f1.s1{fill:url(#st1)} .sym .f1.s2{fill:url(#st2)}
.sym .f2{fill:none}
#st0 rect{fill:var(--c0-line)} #st1 rect{fill:var(--c1-line)} #st2 rect{fill:var(--c2-line)}

/* Side: the stack and the controls */
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:clamp(58px, 7vw, 76px)}
.stack{display:flex;flex-direction:column;align-items:center;gap:4px;font:800 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stack i{width:34px;height:23px;border-radius:5px;background:var(--card);box-shadow:3px -3px 0 var(--card-edge),6px -6px 0 rgba(207,207,210,.6)}
.round{width:clamp(52px, 6vw, 64px);height:clamp(52px, 6vw, 64px);border-radius:50%;border:0;background:var(--felt-3);color:var(--ink);
  display:grid;place-items:center;font:800 19px/1 var(--f-display);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.round:active{transform:translateY(2px)}
.round svg{width:26px;height:26px;fill:currentColor}

/* Center sheet: setup, menu, rules, confirm */
#sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,12,10,.55);
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.sheet{width:min(520px, 100%);max-height:100%;overflow:auto;background:var(--felt-2);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.sheet h1,.sheet h2{margin:0;font:800 30px/1.1 var(--f-display);text-wrap:balance}
.sheet h2{font-size:24px}
.sheet p{margin:0;color:var(--muted);max-width:60ch}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width: 460px){ .names{grid-template-columns:1fr} }
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:700 11px var(--f-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.field input{height:48px;border-radius:12px;border:2px solid var(--felt-3);background:var(--felt);color:var(--ink);padding:0 12px;font:600 17px var(--f-ui);width:100%}
.field.f0 input{border-color:color-mix(in srgb, var(--p0) 60%, transparent)}
.field.f1 input{border-color:color-mix(in srgb, var(--p1) 60%, transparent)}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{height:48px;padding:0 20px;border-radius:12px;border:0;font:700 16px var(--f-ui)}
.btn.primary{background:var(--p0);color:var(--p-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--felt-3)}
.btn.wide{width:100%}
.menu{display:flex;flex-direction:column}
.menu button{height:54px;text-align:left;border:0;border-bottom:1px solid var(--felt-3);background:transparent;font:600 17px var(--f-ui);padding:0 2px}
.ex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.ex .card{--cw:54px;pointer-events:none}
.tally{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.tally b{color:var(--ink);font:800 18px var(--f-display)}

/* Winner rainbow */
#fx{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden;transition:opacity .6s}
#fx.fade{opacity:0}
.rb-e,.rb-fall{position:absolute;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.rb-e{font-size:var(--fs);transform:translate(-50%,-50%) scale(0);animation:rbpop .5s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes rbpop{to{transform:translate(-50%,-50%) scale(1)}}
.rb-name{position:absolute;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:999px;background:var(--p0);color:var(--p-ink);
  font:800 22px/1.1 var(--f-display);white-space:nowrap;box-shadow:0 8px 24px var(--shadow);opacity:0;animation:rbname .5s 1.4s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes rbname{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.8)}to{opacity:1;transform:translateX(-50%)}}
.rb-fall{top:-48px;font-size:30px;animation:rbfall linear both}
@keyframes rbfall{from{transform:translateY(0) rotate(0)}to{transform:translateY(calc(100vh + 96px)) rotate(var(--r))}}

@media (max-width: 560px){
  .zone{gap:8px;padding:4px 12px}
  .z-score{min-width:44px}
  .side{width:52px}
}
@media (prefers-reduced-motion: reduce){
  .card,.card.deal,.card.nope,.card.hint,.card.go0,.card.go1,.z-score.bump b,.buzz .cap,.timer b{animation:none!important;transition:none}
  .card.go0,.card.go1{opacity:0}
  .rb-e{animation:none;transform:translate(-50%,-50%)} .rb-name{animation:none;opacity:1} .rb-fall{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <pattern id="st0" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="2.6" height="7"/></pattern>
  <pattern id="st1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="2.6" height="7"/></pattern>
  <pattern id="st2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="2.6" height="7"/></pattern>
</defs></svg>
<div id="app">
  <section class="zone" id="z1" data-p="1" aria-label="Speler boven"></section>
  <main class="board" aria-label="Tafel">
    <div class="grid" id="grid"><div class="cards" id="cards"></div></div>
    <aside class="side" id="side"></aside>
  </main>
  <section class="zone" id="z0" data-p="0" aria-label="Speler onder"></section>
</div>
<div id="sheet" hidden></div>
<div id="fx" aria-hidden="true"></div>

<script>
/* Game logic. A card is a number 0..80; its four features are its digits in base 3:
   count (1-3), shape (rondje, vierkant, driehoek), filling (vol, gestreept, leeg), colour (blauw, rood, geel).
   Three cards form a set when every feature is all the same or all different, i.e. the digits sum to 0 mod 3. */
window.DT = (() => {
  const feat = id => [id % 3, Math.floor(id / 3) % 3, Math.floor(id / 9) % 3, Math.floor(id / 27) % 3];
  function isSet(a, b, c) {
    if (a === b || b === c || a === c) return false;
    const A = feat(a), B = feat(b), C = feat(c);
    return A.every((x, k) => (x + B[k] + C[k]) % 3 === 0);
  }
  function findSet(board) {
    for (let i = 0; i < board.length; i++)
      for (let j = i + 1; j < board.length; j++)
        for (let k = j + 1; k < board.length; k++)
          if (isSet(board[i], board[j], board[k])) return [i, j, k];
    return null;
  }
  function shuffle(a) {
    const r = new Uint32Array(1);
    for (let i = a.length - 1; i > 0; i--) {
      try { crypto.getRandomValues(r); } catch (e) { r[0] = Math.floor(Math.random() * 4294967296); }
      const j = r[0] % (i + 1); const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  const fullDeck = () => Array.from({ length: 81 }, (_, i) => i);
  return { feat, isSet, findSet, shuffle, fullDeck };
})();
</script>

<script>
(() => {
const { feat, isSet, findSet, shuffle, fullDeck } = window.DT;
const SHAPES = ['rondje', 'vierkant', 'driehoek'], SHAPES_N = ['rondjes', 'vierkanten', 'driehoeken'];
const COLORS = ['blauw', 'rood', 'geel'], FILLS = ['vol', 'gestreept', 'leeg'];
const KEY = 'drietal-v1';
const $ = s => document.querySelector(s);
const store = {
  get() { try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
};

/* Saved on the device: the game itself. Not saved: who is choosing right now. */
let G = sane(store.get()) || { v: 1, status: 'setup', names: ['', ''], deck: [], board: [], scores: [0, 0], wins: [0, 0], draws: 0 };
const T = { claim: null, sel: [], msg: [null, null], msgTimer: [0, 0], busy: false, sheet: null, nameDraft: G.names.slice(),
  fx: new Map(), hintAt: 0, bump: null, lastCols: 0, ends: 0, raf: 0, backup: 0, lastSec: 0,
  sound: (() => { try { return localStorage.getItem('drietal-sound') !== '0'; } catch (e) { return true; } })() };
const CLAIM_MS = 5000;   /* time to pick your three cards after pressing Set */
if (G.status === 'setup') T.sheet = 'setup';

function sane(g) {
  try {
    if (!g || g.v !== 1 || !Array.isArray(g.board) || !Array.isArray(g.deck)) return null;
    const ids = g.board.concat(g.deck);
    if (!ids.every(x => Number.isInteger(x) && x >= 0 && x < 81) || new Set(ids).size !== ids.length) return null;
    if (!Array.isArray(g.names) || g.names.length !== 2 || !Array.isArray(g.scores) || !Array.isArray(g.wins)) return null;
    return g;
  } catch (e) { return null; }
}
const save = () => store.set(G);
const nm = i => (G.names[i] || '').trim() || (i ? 'Boven' : 'Onder');

/* ---------- drawing ---------- */
function E(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (tag === 'button') n.type = 'button';
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'disabled') n.disabled = true;
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false && c !== '') n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const tri = y => `M50 ${y - 18}L69 ${y + 17}H31Z`;
function cardSVG(id) {
  const [n, shape, fill, color] = feat(id);
  const ys = [[75], [53, 97], [31, 75, 119]][n];
  const cls = `s${color} f${fill}`;
  const sym = y => shape === 0 ? `<circle cx="50" cy="${y}" r="17"/>`
    : shape === 1 ? `<rect x="34" y="${y - 16}" width="32" height="32" rx="5"/>`
    : `<path d="${tri(y)}"/>`;
  return `<svg viewBox="0 0 100 150" class="sym" aria-hidden="true"><g class="${cls}" stroke-width="4.5" stroke-linejoin="round">${ys.map(sym).join('')}</g></svg>`;
}
function cardLabel(id) {
  const [n, shape, fill, color] = feat(id);
  return `${n + 1} ${n ? SHAPES_N[shape] : SHAPES[shape]}, ${COLORS[color]}, ${FILLS[fill]}`;
}
function cardEl(id, i) {
  const b = E('button', { class: 'card', 'data-act': 'card', 'data-i': i, 'aria-label': cardLabel(id), html: cardSVG(id) });
  if (T.sel.includes(i)) { b.classList.add('sel'); b.style.setProperty('--pc', `var(--p${T.claim})`); }
  const fx = T.fx.get(i);
  if (fx) b.classList.add(fx);
  return b;
}

/* Fit all open cards as large as possible in the space between the two bands. */
function layout() {
  const wrap = $('#grid'), cards = $('#cards');
  const W = wrap.clientWidth, H = wrap.clientHeight, n = Math.max(G.board.length, 1);
  if (!W || !H) return;
  const gap = Math.max(8, Math.min(16, Math.round(Math.min(W, H) / 45)));
  let best = { cw: 0, cols: 1 };
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const cw = Math.min((W - (c - 1) * gap) / c, ((H - (r - 1) * gap) / r) / 1.5);
    if (cw > best.cw) best = { cw, cols: c };
  }
  cards.style.setProperty('--cw', Math.floor(Math.min(best.cw, 190)) + 'px');
  cards.style.setProperty('--cols', best.cols);
  cards.style.setProperty('--gap', gap + 'px');
}

function zoneEl(i) {
  const z = $('#z' + i);
  const claiming = T.claim === i, other = T.claim !== null && T.claim !== i;
  z.className = 'zone' + (claiming ? ' claiming' : '');
  let btn;
  if (G.status === 'over') btn = E('button', { class: 'z-new', 'data-act': 'askNew' }, 'Nieuw spel');

const RB_BANDS = ['❤️', '🧡', '💛', '💚', '💙', '💜'];

<script>
/* Offline: keep a copy of the game on this device so it also opens in airplane mode. */
/* New version: the copy-keeper swaps itself in, and the page reloads once nobody is choosing cards. */
if ('serviceWorker' in navigator) {
  /* Only an update of Drietal's own copy-keeper counts; the first time it takes over (from Rummy Cup's, or from none) is not an update. */
  const ours = w => !!w && /\/drietal\/sw\.js$/.test(w.scriptURL);
  let hadCtrl = ours(navigator.serviceWorker.controller), reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadCtrl) { hadCtrl = true; return; }
    if (reloading) return;
    reloading = true;
    const go = () => (window.DT_idle && !window.DT_idle()) ? setTimeout(go, 1500) : location.reload();
    go();
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
    /* Check for a new version whenever the app comes back to the front, and every 10 minutes while open. */
    const check = () => { if (document.visibilityState === 'visible' && navigator.onLine !== false) reg.update().catch(() => {}); };
    document.addEventListener('visibilitychange', check);
    setInterval(check, 10 * 60 * 1000);
