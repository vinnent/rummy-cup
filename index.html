<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rummy Cup">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c2a581" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a2017" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Rummy Cup Samen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Rubik:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen game table. Felt surface fills the middle, opponent bar on top, your own rack tray docked at the bottom. */
:root{
  --felt:#d4ded6; --felt-edge:#bccabf; --felt-deep:#c3d0c6; --card:#eef3ef; --ink:#13201b; --muted:#53655d; --line:#a9b9af;
  --tray:#25322e; --tray-ledge:#18221f; --tray-ink:#e9efea; --tray-muted:#9cada5; --tray-line:#41524b;
  --ivory:#fcf9f0; --ivory-edge:#ddd3bd;
  --t-red:#c42d27; --t-blue:#1b57ab; --t-black:#17171a; --t-orange:#d27310;
  --accent:#f0b12b; --accent-ink:#1d1505; --sel:#e09400; --recent:#24877c; --bad:#bf2a24; --good:#2a7d4b;
  --shadow:rgba(12,22,18,.26); --scrim:rgba(8,14,12,.45); --sticker:#fff;
  --f-tile:"Rubik","Arial Black",system-ui,sans-serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --felt:#15201c; --felt-edge:#0d1613; --felt-deep:#1f2e29; --card:#1b2723; --ink:#e5ede8; --muted:#91a39a; --line:#33463e;
    --tray:#0c1210; --tray-ledge:#050908; --tray-ink:#e5ede8; --tray-muted:#87988f; --tray-line:#2b3a34;
    --ivory:#eee7d6; --ivory-edge:#c6baa0;
    --t-red:#c02a24; --t-blue:#1a54a6; --t-black:#17171a; --t-orange:#cc6e0c;
    --accent:#f3b838; --accent-ink:#1d1505; --sel:#f3b838; --recent:#4cc2b3; --bad:#ff6d61; --good:#5cc98a;
    --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --felt:#15201c; --felt-edge:#0d1613; --felt-deep:#1f2e29; --card:#1b2723; --ink:#e5ede8; --muted:#91a39a; --line:#33463e;
  --tray:#0c1210; --tray-ledge:#050908; --tray-ink:#e5ede8; --tray-muted:#87988f; --tray-line:#2b3a34;
  --ivory:#eee7d6; --ivory-edge:#c6baa0;
  --t-red:#c02a24; --t-blue:#1a54a6; --t-black:#17171a; --t-orange:#cc6e0c;
  --accent:#f3b838; --accent-ink:#1d1505; --sel:#f3b838; --recent:#4cc2b3; --bad:#ff6d61; --good:#5cc98a;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box;background:var(--felt)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font:400 15px/1.45 var(--f-ui);
  background:var(--felt) radial-gradient(130% 90% at 50% 25%, var(--felt) 0 55%, var(--felt-edge) 100%)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);background:var(--tray);z-index:1}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-tile);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}

#app{height:100%;display:flex;flex-direction:column}
.band{padding-left:max(16px, env(safe-area-inset-left,0px), calc((100% - 760px) / 2));
      padding-right:max(16px, env(safe-area-inset-right,0px), calc((100% - 760px) / 2))}

/* Header */
.top{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:10px 6px}
.opp{min-width:0}
.opp-name{display:flex;align-items:center;gap:7px;font:600 15px/1.2 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp-name .nm{overflow:hidden;text-overflow:ellipsis}
.opp-sub{font:500 12px/1.3 var(--f-ui);color:var(--muted);margin-top:2px;white-space:nowrap}
.brand{font:800 18px var(--f-tile);letter-spacing:-.01em}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.pill{font:600 13px/1 var(--f-ui);padding:8px 12px;border-radius:999px;background:var(--felt-deep);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.pill.mine{background:var(--accent);color:var(--accent-ink)}
.top-r{justify-self:end;display:flex;align-items:center;gap:6px}
.pot{display:flex;flex-direction:column;align-items:center;line-height:1;padding:0 4px}
.pot-n{font:700 17px var(--f-tile);font-variant-numeric:tabular-nums}
.pot-l{font:600 10px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:active{background:var(--felt-deep)}
.ic{fill:currentColor}

/* Table */
.table{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:6px 14px}
.sets{--stw:clamp(27px, 8.1vw, 40px);display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-start}
.set{display:flex;flex-wrap:wrap;gap:3px;padding:5px;border-radius:10px;background:var(--felt-deep);max-width:100%}
.set.bad{outline:2px dashed var(--bad);outline-offset:1px}
.set .tile{--tw:var(--stw)}
.add{width:var(--stw);height:calc(var(--stw) * 1.34);border-radius:6px;border:2px dashed var(--ink);background:transparent;font:700 20px/1 var(--f-ui);cursor:pointer;opacity:.75}
.newset{height:calc(var(--stw) * 1.34 + 10px);padding:0 16px;border-radius:10px;border:2px dashed var(--ink);background:transparent;font:600 14px var(--f-ui);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:40px 12px;max-width:34ch;margin:0 auto}
.live-badge{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--recent);margin-bottom:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--recent);display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* Tiles */
.tile{--tw:40px;flex:none;position:relative;width:var(--tw);height:calc(var(--tw) * 1.34);margin:0;border:0;
  padding:0 0 calc(var(--tw) * .28);border-radius:calc(var(--tw) * .16);
  background:linear-gradient(180deg,var(--ivory) 0 74%,var(--ivory-edge));
  box-shadow:0 1px 0 var(--ivory-edge),0 2px 4px var(--shadow);
  display:grid;place-items:center;font:800 calc(var(--tw) * .52)/1 var(--f-tile);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--t-black);user-select:none;-webkit-user-select:none}
.tile::after{content:"";position:absolute;left:50%;bottom:14%;width:calc(var(--tw) * .2);height:calc(var(--tw) * .2);border-radius:50%;
  border:max(1.5px, calc(var(--tw) * .045)) solid currentColor;transform:translateX(-50%);opacity:.5}
button.tile{cursor:pointer}
.c-r{color:var(--t-red)} .c-b{color:var(--t-blue)} .c-z{color:var(--t-black)} .c-o{color:var(--t-orange)}
.tile.joker{padding:0}
.tile.joker::after{display:none}
.jk{width:70%;height:auto;display:block}
.jk-f{fill:none;stroke:var(--t-red);stroke-width:2.2}
.jk-e1{fill:var(--t-blue)} .jk-e2{fill:var(--t-black)}
.jk-m{fill:none;stroke:var(--t-orange);stroke-width:2.2;stroke-linecap:round}
.tile.mine{box-shadow:inset 0 -3px 0 var(--sel),0 1px 0 var(--ivory-edge),0 2px 4px var(--shadow)}
.tile.recent{box-shadow:0 0 0 2px var(--recent),0 2px 4px var(--shadow)}
.tile.new{box-shadow:0 0 0 2px var(--accent),0 2px 4px var(--shadow)}
.tile.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--sel),0 8px 12px var(--shadow)}

/* Strip between table and rack */
.strip{flex:none;min-height:48px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-block:6px;font:500 14px/1.35 var(--f-ui);color:var(--muted)}
.strip.bad{color:var(--bad);font-weight:600}
.strip.hint{color:var(--ink)}
.strip.picking{color:var(--ink)}
.sel-n{font-weight:700}
.strip-btns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font:600 13px var(--f-ui);cursor:pointer;white-space:nowrap}
.chip.quiet{border-color:var(--line);color:var(--muted)}
.meld{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meld-bar{width:72px;height:6px;border-radius:3px;background:var(--felt-deep);overflow:hidden;display:inline-block}
.meld-fill{display:block;height:100%;background:var(--accent)}
.meld-fill.ok{background:var(--good)}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--recent);font-weight:600}

/* Rack tray */
.dock{flex:none;background:var(--tray);color:var(--tray-ink);padding-block:10px 12px;border-top:3px solid var(--tray);position:relative;z-index:2}
.dock.myturn{border-top-color:var(--accent)}
.rack{--rt:clamp(32px, 9.3vw, 48px);display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:9px 8px 8px;
  min-height:calc(var(--rt) * 1.34 + 17px);max-height:calc(var(--rt) * 2.68 + 6px + 17px);overflow-y:auto;
  background:var(--tray-ledge);border-radius:12px;box-shadow:inset 0 2px 0 var(--shadow)}
.rack .tile{--tw:var(--rt)}
.rack-empty{color:var(--tray-muted);font:500 14px var(--f-ui);align-self:center;padding:0 6px}
.acts{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:44px}
.acts-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--tray-ledge);border-radius:10px;padding:3px;flex:none}
.seg-b{height:34px;padding:0 11px;border:0;border-radius:8px;background:transparent;color:var(--tray-muted);font:600 13px var(--f-ui);cursor:pointer}
.seg-b.on{background:var(--tray-line);color:var(--tray-ink)}
.wait{font:500 14px var(--f-ui);color:var(--tray-muted);text-align:right}
.btn{height:44px;padding:0 18px;border-radius:12px;border:0;font:700 15px var(--f-ui);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--tray-ink);box-shadow:inset 0 0 0 1.5px var(--tray-line)}
.card .btn.ghost,.sheet .btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}

/* Cards (empty states) */
.card{max-width:440px;margin:18px auto;background:var(--card);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line),0 10px 30px var(--shadow)}
.card h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.card h2,.sheet h2{font-size:22px;font-weight:700}
.muted{color:var(--muted)}
.note{color:var(--bad);font-weight:600}
.deco{display:flex;gap:6px}
.deco .tile{--tw:42px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:700 11px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--felt);color:var(--ink);padding:0 12px;font:500 16px var(--f-ui);width:100%}

/* Bottom sheet */
#sheet{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:86%;overflow-y:auto;background:var(--card);color:var(--ink);
  border-radius:20px 20px 0 0;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:16px;font-weight:700;margin-top:6px}
.sheet-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.menu{display:flex;flex-direction:column}
.menu-i{text-align:left;height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;font:600 16px var(--f-ui);cursor:pointer;padding:0 2px}
.stand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;font:500 14px var(--f-ui);color:var(--muted)}
.stand-l{font:700 11px var(--f-ui);text-transform:uppercase;letter-spacing:.08em}
.stand b{font:700 18px var(--f-tile);color:var(--ink)}
.reveal{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--felt-deep)}
.reveal-h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.mini{display:flex;flex-wrap:wrap;gap:4px}
.mini .tile{--tw:26px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.ex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.ex .grp{display:flex;gap:3px;padding:4px;border-radius:8px;background:var(--felt-deep)}
.ex .tile{--tw:28px}

/* Pass-and-play: wider table and bigger tiles on a tablet, hidden rack during the hand-over */
html.pass .band{padding-left:max(16px, env(safe-area-inset-left,0px), calc((100% - 1100px) / 2));padding-right:max(16px, env(safe-area-inset-right,0px), calc((100% - 1100px) / 2))}
@media (min-width: 700px){
  /* iPad: tiles sized to the screen (an iPad mini gets roughly the same feel as a phone), capped by height in landscape */
  html.pass .sets{--stw:clamp(40px, min(6.4vw, 6.8vh), 62px)}
  html.pass .rack{--rt:clamp(46px, min(7.8vw, 7.2vh), 72px)}
  html.pass .mini .tile,html.pass .ex .tile{--tw:34px}
  html.pass .deco .tile{--tw:52px}
}
html.pass .acts{flex-wrap:wrap}
.rack-hidden{align-content:center}
.rack-hidden .tile-back{--tw:var(--rt);box-shadow:inset 0 0 0 2px var(--ivory),0 1px 3px var(--shadow)}
.hand-to{font:600 15px var(--f-ui);color:var(--tray-ink);min-width:0}
.pass-names{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width: 420px){ .pass-names{grid-template-columns:1fr} }

/* Your turn: the tray edge glows a few times when the turn arrives */
.dock.myturn{animation:turnglow 1.2s ease-out 3}
@keyframes turnglow{0%{box-shadow:0 -10px 26px -6px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* Face-down double (house rule): tile back is striped accent */
.tile-back{--tw:30px;flex:none;display:inline-block;position:relative;width:var(--tw);height:calc(var(--tw) * 1.34);border-radius:calc(var(--tw) * .18);
  background:var(--accent) repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 3px, transparent 3px 7px);
  box-shadow:inset 0 0 0 2px var(--ivory),0 1px 3px var(--shadow)}
.tile-back.in-rack{--tw:var(--rt);border:0;padding:0;margin-left:8px;cursor:pointer;display:grid;place-items:center}
.tile-back.in-rack span{font:800 8px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.02em;color:var(--accent-ink);background:var(--accent);padding:2px;border-radius:3px}
.opp-sub .tile-back{--tw:10px;vertical-align:-2px;margin-right:5px;box-shadow:inset 0 0 0 1px var(--ivory)}
.dbl-hint{color:var(--ink)}
.dbl-show{display:flex;align-items:center;gap:16px;padding:12px;border-radius:12px;background:var(--felt-deep)}
.dbl-show .tile{--tw:46px}
.dbl-show p{min-width:0}

/* Jury Claude: emoji stickers slapped over the screen after every turn (no card, taps go straight through) */
#jury{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.stk{position:absolute;font-size:var(--sz);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  transform:translate(-50%,-50%) rotate(var(--rot)) scale(0);
  filter:drop-shadow(3px 0 0 var(--sticker)) drop-shadow(-3px 0 0 var(--sticker)) drop-shadow(0 3px 0 var(--sticker)) drop-shadow(0 -3px 0 var(--sticker)) drop-shadow(0 7px 10px var(--shadow));
  animation:stkIn .45s cubic-bezier(.2,1.6,.4,1) var(--d) forwards, stkOut .45s ease-in var(--out) forwards}
@keyframes stkIn{0%{transform:translate(-50%,-50%) rotate(calc(var(--rot) - 30deg)) scale(1.9);opacity:0}100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);opacity:1}}
@keyframes stkOut{0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);opacity:1}100%{transform:translate(-50%,-70%) rotate(calc(var(--rot) + 8deg)) scale(.8);opacity:0}}

/* Winner: a rainbow of emoji draws itself, then party emoji rain down */
#rainbow{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden;transition:opacity .6s}
#rainbow.fade{opacity:0}
.rb-e,.rb-fall{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.rb-e{position:absolute;font-size:var(--fs);transform:translate(-50%,-50%) scale(0);animation:rbpop .5s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes rbpop{to{transform:translate(-50%,-50%) scale(1)}}
.rb-name{position:absolute;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font:800 20px/1.1 var(--f-tile);white-space:nowrap;box-shadow:0 8px 24px var(--shadow);opacity:0;animation:rbname .5s 1.4s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes rbname{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.8)}to{opacity:1;transform:translateX(-50%)}}
.rb-fall{position:absolute;top:-48px;font-size:28px;animation-name:rbfall;animation-timing-function:cubic-bezier(.3,.1,.6,1);animation-fill-mode:both}
@keyframes rbfall{from{transform:translateY(0) rotate(0)}to{transform:translateY(calc(100vh + 96px)) rotate(var(--r))}}

/* ---------- Samen (this build): a wooden table and real two-ledge racks ---------- */
html.pass{
  --felt:#c2a581; --felt-edge:#a98a66; --felt-deep:rgba(96,62,30,.14); --card:#f8f2e8; --field:#fffaf2;
  --ink:#24180e; --muted:#46331f; --line:#b49a7b;
  --shadow:rgba(46,26,8,.32); --scrim:rgba(30,18,8,.45);
  --wood-shade:radial-gradient(140% 95% at 50% 35%, transparent 55%, rgba(70,40,14,.20)), linear-gradient(transparent, transparent);
  --rk-hi:#b57a4a; --rk:#8a5531; --rk-lo:#653a1d; --rk-deep:#4a2913; --rk-ink:#f6e6d2;
  background-color:var(--felt);
  background-image:var(--wood-shade), url(wood.jpg);
  background-size:100% 100%, 100% 100%, 640px auto;
  background-attachment:fixed;
}
@media (prefers-color-scheme: dark){
  html.pass:not([data-theme="light"]){
    --felt:#4b3d2d; --felt-edge:#33281d; --felt-deep:rgba(0,0,0,.24); --card:#2b2119; --field:#1f1812;
    --ink:#f2e8dc; --muted:#cdb9a2; --line:#6b5641;
    --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
    --wood-shade:radial-gradient(140% 95% at 50% 35%, transparent 50%, rgba(0,0,0,.35)), linear-gradient(rgba(16,9,3,.66), rgba(16,9,3,.66));
    --rk-hi:#8f5b33; --rk:#6b3f21; --rk-lo:#4c2a14; --rk-deep:#2e180a; --rk-ink:#efdcc4;
  }
}
html.pass[data-theme="dark"]{

<script>
/* Pure game logic: tiles, sets, scoring. Tile ids: colour (r rood, b blauw, z zwart, o oranje) + number + copy (a/b); jokers J1, J2. */
window.RC = (() => {
  const TILE_RE = /^(?:[rbzo](?:1[0-3]|[1-9])[ab]|J[12])$/;
  const CORD = { z: 0, b: 1, o: 2, r: 3 };
  const isJ = id => id[0] === 'J';
  const num = id => +id.slice(1, -1);
  const col = id => id[0];
  const pts = id => isJ(id) ? 30 : num(id);
  const sum = ids => ids.reduce((t, id) => t + pts(id), 0);
  function allTiles() {
    const out = [];
    for (const c of 'rbzo') for (let n = 1; n <= 13; n++) for (const k of 'ab') out.push(c + n + k);
    out.push('J1', 'J2');
    return out;
  }
  function shuffle(a) {
    const r = new Uint32Array(1);
    for (let i = a.length - 1; i > 0; i--) {
      crypto.getRandomValues(r);
      const j = r[0] % (i + 1);
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function runOk(ids) {
    const N = ids.filter(id => !isJ(id));
    if (!N.length || ids.length > 13) return false;
    const c = col(N[0]);
    if (!N.every(id => col(id) === c)) return false;
    const ns = N.map(num).sort((a, b) => a - b);
    for (let i = 1; i < ns.length; i++) if (ns[i] === ns[i - 1]) return false;
    return ns[ns.length - 1] - ns[0] + 1 <= ids.length;
  }
  function groupOk(ids) {
    const N = ids.filter(id => !isJ(id));
    if (!N.length || ids.length > 4) return false;
    const n = num(N[0]);
    if (!N.every(id => num(id) === n)) return false;
    return new Set(N.map(col)).size === N.length;
  }
  const setOk = ids => ids.length >= 3 && (runOk(ids) || groupOk(ids));
  function arrangeRun(ids) {
    const N = ids.filter(id => !isJ(id)).sort((a, b) => num(a) - num(b));
    const jk = ids.filter(isJ);
    const out = [];
    N.forEach((id, i) => {
      if (i > 0) for (let g = num(N[i - 1]) + 1; g < num(id) && jk.length; g++) out.push(jk.shift());
      out.push(id);
    });
    let lo = num(N[0]), hi = num(N[N.length - 1]);
    while (jk.length) {
      if (hi < 13) { out.push(jk.shift()); hi++; }
      else if (lo > 1) { out.unshift(jk.shift()); lo--; }
      else out.push(jk.shift());

    return out;
  }
  function arrangeGroup(ids) {
    const N = ids.filter(id => !isJ(id)).sort((a, b) => CORD[col(a)] - CORD[col(b)] || (a < b ? -1 : 1));
    return N.concat(ids.filter(isJ));
  }
  function arrange(ids) {
    const N = ids.filter(id => !isJ(id));
    if (!N.length) return ids.slice();
    const c = col(N[0]);
    const runLike = N.every(id => col(id) === c) && new Set(N.map(num)).size === N.length;
    return runLike ? arrangeRun(ids) : arrangeGroup(ids);
  }
  function setValue(ids) {
    let v = 0;
    if (runOk(ids)) {
      const a = arrangeRun(ids);
      const i = a.findIndex(id => !isJ(id));
      const n0 = num(a[i]);
      v = Math.max(v, a.reduce((t, _, j) => t + n0 + j - i, 0));
    }
    if (groupOk(ids)) v = Math.max(v, num(ids.find(id => !isJ(id))) * ids.length);
    return v;
  }
  function sortRack(arr, mode) {
    return arr.slice().sort((a, b) => {
      if (isJ(a) !== isJ(b)) return isJ(a) ? 1 : -1;
      if (isJ(a)) return a < b ? -1 : 1;
      const d = mode === 'num'
        ? (num(a) - num(b)) || (CORD[col(a)] - CORD[col(b)])
        : (CORD[col(a)] - CORD[col(b)]) || (num(a) - num(b));
      return d || (a < b ? -1 : a > b ? 1 : 0);
    });
  }
  return { TILE_RE, CORD, isJ, num, col, pts, sum, allTiles, shuffle, runOk, groupOk, setOk, arrange, setValue, sortRack };
})();

<script>

  const r1 = pool.splice(0, 14), r2 = pool.splice(0, 14);
  const turn = Math.random() < 0.5 ? 0 : 1;
  const gameId = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const doc = {
    v: 1, gameId, status: 'playing', seats: ['p1', 'p2'], names: { p1: n1, p2: n2 }, counts: { p1: 14, p2: 14 }, melded: {}, reveal: {},
    turn, turnNo: 1, pool, table: [], passes: 0, last: { kind: 'start', key: null, n: 0, ids: [] }, winner: null, history, created: Date.now(),
    dbl: {}, dblIn: {}, swapOut: {}, swap: null, streak: {}, jury: null
  };
  LS.set(rackKey('p1'), { gameId, tiles: r1 });
  LS.set(rackKey('p2'), { gameId, tiles: r2 });
  S.key = doc.seats[turn]; S.rack = loadRack(S.key); S.view = 'handoff';
  S.sheet = null; S.newTile = null; S.draft = null; S.sel.clear(); S.msg = null;
  await gameRef.set(doc);
  render();
}
function passHandoff() {
  const g = S.G;
  if (!PASS || !g || g.status !== 'playing' || S.busy) return;
  S.key = g.seats[g.turn]; S.rack = loadRack(S.key); S.view = 'handoff';
  S.newTile = null; S.sel.clear(); S.draft = null; S.msg = null; clearTimeout(S.msgTimer); S.sheet = null;
  render(); setTitle();
}
function passReveal() {
  const g = S.G;
  if (!PASS || !g || g.status !== 'playing') return;
  S.key = g.seats[g.turn]; S.rack = loadRack(S.key); S.view = 'play';
  ensureDraft(); applyIncoming(); healCheck(); render();
}
function bootPass() {
  gameRef = localDoc('rcs-game');
  rackRef = { async set(d) { LS.set(rackKey(S.key), clone(d)); }, onSnapshot() { return () => {}; } };
  S.gameFresh = true; S.rackFresh = true; S.rackReady = true;
  const names = LS.get('rcs-names');
  if (Array.isArray(names)) S.pn = [String(names[0] || ''), String(names[1] || '')];
  const g0 = LS.get('rcs-game');
  if (g0 && Array.isArray(g0.seats) && g0.seats.length === 2) {
    S.key = g0.status === 'playing' ? g0.seats[g0.turn] : g0.seats[0];
    S.rack = loadRack(S.key);
    S.view = g0.status === 'playing' ? 'handoff' : 'after';
    if (g0.status === 'over') S.overShown = g0.gameId;
  }
  gameRef.onSnapshot(snap => { S.ready = true; S.G = snap.exists ? snap.data() : null; onGame(); });
}

/* ---------- boot ---------- */
async function boot(saved) {
  if (saved && saved.draft && typeof saved.draft === 'object') S.restore = saved.draft;
  render();
  if (PASS) { bootPass(); return; }
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { S.noDb = true; render(); return; }
  try { sampleP = Promise.resolve(C.use('sample')).catch(() => null); } catch (e) { sampleP = null; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) {}
  if (!db) { S.noDb = true; render(); return; }
  try { S.uid = user ? await user.id() : null; } catch (e) { S.uid = null; }
  try { S.canWrite = user ? await user.can('data.write') : null; } catch (e) { S.canWrite = null; }
  gameRef = db.doc('games/main');
  try { rackRef = S.uid ? db.doc('data/users/' + S.uid + '/rummi') : null; } catch (e) { rackRef = null; }
  if (!rackRef) { S.uid = null; rackRef = db.doc('hands/' + token); }
  S.key = S.uid || token;
  S.loadTimer = setTimeout(() => { S.slow = true; render(); }, 10000);
  gameRef.onSnapshot(snap => {
    S.ready = true;
    S.G = snap.exists ? snap.data() : null;
    if (!(snap.metadata && snap.metadata.fromCache)) { clearTimeout(S.loadTimer); S.slow = false; S.gameFresh = true; }
    onGame();
  }, err => { S.ready = true; S.dbErr = (err && err.code) || 'unavailable'; clearTimeout(S.loadTimer); render(); });
  rackRef.onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    S.rack = d ? { gameId: d.gameId, tiles: Array.isArray(d.tiles) ? d.tiles.slice() : [] } : null;
    S.rackReady = true;
    if (!(snap.metadata && snap.metadata.fromCache)) S.rackFresh = true;
    ensureDraft(); applyIncoming(); maybeReveal(); healCheck(); pushPresence(); render(); setTitle();
  }, () => { S.rackReady = true; render(); });
  C.use('room').then(room => {
    if (!room) return;
    S.room = room;
    room.onPeers(ch => { S.peers = ch.peers; render(); }, () => {});
    pushPresence();
  }).catch(() => {});
}
/* Keep a half-finished turn when this page is updated while open. */
let booted = false;
function startOnce(saved) { if (booted) return; booted = true; boot(saved && typeof saved === 'object' ? saved : {}); }
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ draft: S.draft ? JSON.parse(JSON.stringify(S.draft)) : null }));
  if (hot && typeof hot.ready === 'function') { hot.ready(startOnce); setTimeout(() => startOnce({}), 2500); }
  else startOnce((hot && hot.data) || {});
} catch (e) { startOnce({}); }
})();
</script>
